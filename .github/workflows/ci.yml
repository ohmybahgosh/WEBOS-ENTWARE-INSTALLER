name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WEBOS_CLI: "3.2.6"
  ESLINT: "10.14.0"
  PLAYWRIGHT: "1.63.0"
  ACTIONLINT: "1.7.12"

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck the installer (POSIX sh, like the TV)
        run: shellcheck -s sh -S warning webos-entware-installer.sh
      - name: ShellCheck the test scripts
        run: shellcheck -S warning tests/run_tests.sh tests/check-ipk.sh webos-app/build.sh
      - name: ShellCheck the tv command and its tab completion (written by the installer)
        run: |
          sed -n "/<< 'TVCLI'$/,/^TVCLI$/p" webos-entware-installer.sh | sed '1d;$d' > "$RUNNER_TEMP/tv"
          sed -n "/<< 'COMPLETION'$/,/^COMPLETION$/p" webos-entware-installer.sh | sed '1d;$d' > "$RUNNER_TEMP/completion.bash"
          test -s "$RUNNER_TEMP/tv" && test -s "$RUNNER_TEMP/completion.bash"
          shellcheck -s sh -S warning "$RUNNER_TEMP/tv"
          bash -n "$RUNNER_TEMP/completion.bash"
      - name: Installer parses under dash and busybox sh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox dash
          dash -n webos-entware-installer.sh
          busybox sh -n webos-entware-installer.sh

  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the workflows, and the shell inside them
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@v$ACTIONLINT"
          "$(go env GOPATH)/bin/actionlint" -color
      - name: Every action is pinned to a commit
        run: |
          if grep -rnE '^\s*-?\s*uses:\s*[^ ]+@' .github/workflows | grep -vE '@[0-9a-f]{40}( |$)'; then
            echo "::error::Pin these actions to a full commit SHA"
            exit 1
          fi

  issue-forms:
    name: Issue forms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the issue forms, and the fields the TV app fills in
        run: python3 tests/check-issue-forms.py

  test:
    name: Tests (${{ matrix.shell }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: ["busybox sh", dash]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shells
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox dash
      - name: Run the test suite (needs root for its private mount namespace)
        run: sudo tests/run_tests.sh "${{ matrix.shell }}"

  app:
    name: TV app (lint, build, IPK, UI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Lint the app as ES5, for older webOS browsers
        run: |
          node --check webos-app/gen-manifest.js
          node --check tests/ui-test.js
          node --check tests/web-test.js
          node --check webos-app/web/server.js
          node --check webos-app/web/dash.js
          cd webos-app && npx --yes "eslint@$ESLINT" --max-warnings 0 src/
      - name: Build the IPK and manifest
        run: |
          npm install -g "@webos-tools/cli@$WEBOS_CLI"
          webos-app/build.sh
      - name: Check the IPK and its manifest
        run: tests/check-ipk.sh
      - name: Drive the app with the remote's keys (headless, 1920x1080)
        run: |
          npm install --no-save --no-package-lock "playwright@$PLAYWRIGHT"
          npx playwright install --with-deps chromium
          node tests/ui-test.js webos-app/dist tests/ui-out
          node tests/web-test.js tests/ui-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ipk
          path: webos-app/out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: tests/ui-out/
