name: Release

# Push a tag like v2.8.0 on main and this publishes a GitHub release with
# the installer script, the TV app (IPK), its Homebrew Channel manifest and
# a SHA256SUMS file, after the tests pass.
#
# Building runs with a read-only token; only the publish step, which runs
# no downloaded code, can write.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must be on main and match the script version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag $GITHUB_REF_NAME is not on main"; exit 1; }
          v=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' webos-entware-installer.sh)
          [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "Tag $GITHUB_REF_NAME does not match VERSION=$v"; exit 1; }
      - name: Install shells
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox dash
      - name: Test before releasing
        run: |
          shellcheck -s sh -S warning webos-entware-installer.sh
          python3 tests/check-issue-forms.py
          sudo tests/run_tests.sh "busybox sh"
          sudo tests/run_tests.sh dash
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the TV app (IPK) and its Homebrew Channel manifest
        run: |
          node --check webos-app/src/app.js && node --check webos-app/gen-manifest.js
          npm install -g @webos-tools/cli@3.2.6
          webos-app/build.sh "${GITHUB_REF_NAME#v}"
          tests/check-ipk.sh
          mkdir release
          cp webos-entware-installer.sh webos-app/out/*.ipk webos-app/out/*.manifest.json release/
          (cd release && sha256sum webos-entware-installer.sh ./*.ipk | sed "s# \./# #" > SHA256SUMS)
      - name: Release notes from the changelog
        run: |
          v=$(printf '%s' "${GITHUB_REF_NAME#v}" | sed 's/\./\\./g')
          awk -v v="$v" '
            $0 ~ "^## \\[?" v "\\]?( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md > release/NOTES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd release
          [ -s NOTES.md ] || echo "See CHANGELOG.md" > NOTES.md
          gh release create "$GITHUB_REF_NAME" --repo "$REPO" \
            webos-entware-installer.sh ./*.ipk ./*.manifest.json SHA256SUMS \
            --title "WebOS Entware $GITHUB_REF_NAME" --notes-file NOTES.md
