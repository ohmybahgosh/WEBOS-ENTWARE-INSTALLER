name: Release

# Push a tag like v2.7.0 and this publishes a GitHub release with the
# installer script, the TV app (IPK), its Homebrew Channel manifest and a
# SHA256SUMS file, after the tests pass.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shells
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox dash
      - name: Test before releasing
        run: |
          shellcheck -s sh -S warning webos-entware-installer.sh
          python3 tests/check-issue-forms.py
          sudo tests/run_tests.sh "busybox sh"
      - name: Check the tag matches the script version
        run: |
          v=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' webos-entware-installer.sh)
          tag=${GITHUB_REF_NAME#v}
          [ "$tag" = "$v" ] || { echo "Tag $GITHUB_REF_NAME does not match VERSION=$v"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the TV app (IPK) and its Homebrew Channel manifest
        run: |
          npm install -g @webos-tools/cli
          webos-app/build.sh "${GITHUB_REF_NAME#v}"
          cp webos-app/out/*.ipk webos-app/out/*.manifest.json .
      - name: Build checksums
        run: sha256sum webos-entware-installer.sh *.ipk > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[?" v { on = 1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" webos-entware-installer.sh *.ipk *.manifest.json SHA256SUMS \
            --title "WebOS Entware $GITHUB_REF_NAME" \
            --notes "${notes:-See CHANGELOG.md}"
